# 松月启动器发布管线：推 v* 标签 → 云端编译 MSI → 自动建 Release 附产物
# 手动 workflow_dispatch → 仅编译 + 上传 Actions 产物，不建 Release（用于验证管线/临时出包）
# 构建唯一入口是 installer/build.ps1，本地与云端同源，不在工作流里复述构建步骤。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '产物版本号（如 1.1.1，不带 v 前缀）'
        required: true
        default: '1.1.1'

permissions:
  contents: write

jobs:
  build:
    name: 编译松月启动器 MSI
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 安装 WiX v5 命令行（Bundle 需要的 util/bootstrapperApplications 扩展由 build.ps1 自动补装）
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      # 版本号一律经 env 传给脚本：tag 名允许单引号/$/;等字符，直接内插进 run: 块构成脚本注入
      # （该 job 持 contents:write 令牌，审查 #11）
      - name: 确定版本号（tag 优先去 v 前缀，手动触发用输入值）
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = $env:INPUT_VERSION
          if (-not $v) { $v = ($env:GITHUB_REF_NAME -replace '^v', '') }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "版本号：$v"

      # 排除 FindPythonProcesses_ReturnsLiveProcessesAndKillActuallyKills：该回归需真实枚举进程并读
      # MainModule.FileName，GitHub runner 的临时目录/会话权限差异会让枚举恒为空（v1.1.0 曾通过，
      # 2026-11-08 runner 镜像变化后稳定失败）。本地与真机仍完整运行；runner 恢复 MainModule
      # 可读性后移除下面的 --filter 即可恢复 CI 覆盖。
      - name: 运行单元测试（Core + AiDiagnostics）
        shell: pwsh
        run: dotnet test ComfyUiRocmLauncher.sln -c Release --nologo --filter "FullyQualifiedName!~FindPythonProcesses_ReturnsLiveProcessesAndKillActuallyKills"

      - name: 构建（默认瘦身 Bundle + 内嵌 MSI；加 -Full 出旧版自包含 MSI）
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: ./installer/build.ps1 -Version $env:BUILD_VERSION

      - name: 上传构建产物（Actions 页面可下载）
        uses: actions/upload-artifact@v7
        with:
          name: SongYueLauncher-windows-x64-${{ steps.ver.outputs.version }}
          path: |
            installer/output/*.exe
            installer/output/*.msi
          if-no-files-found: error

      - name: 创建 GitHub Release 并附安装包
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            installer/output/*.exe
            installer/output/*.msi
          generate_release_notes: true
          fail_on_unmatched_files: true
