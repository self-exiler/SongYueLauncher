<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ComfyUI ROCm Launcher">
  <title>ComfyUI ROCm Launcher</title>
  <desc>Launcher app icon: workflow node triangle on dark purple rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241E45"/>
      <stop offset="1" stop-color="#141027"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- links -->
  <g stroke="#E9E4FF" stroke-opacity="0.55" stroke-width="13" stroke-linecap="round">
    <line x1="128" y1="100" x2="128" y2="84"/>
    <line x1="106" y1="150" x2="87" y2="175"/>
    <line x1="150" y1="150" x2="169" y2="175"/>
  </g>

  <!-- center node -->
  <rect x="96" y="96" width="64" height="64" rx="20" fill="url(#core)"/>
  <rect x="105" y="105" width="26" height="13" rx="6.5" fill="#FFFFFF" opacity="0.3"/>

  <!-- satellite nodes -->
  <circle cx="128" cy="64" r="18" fill="#EDE9FF"/>
  <circle cx="72" cy="180" r="16" fill="#EDE9FF"/>
  <circle cx="184" cy="180" r="16" fill="#EDE9FF"/>
</svg>