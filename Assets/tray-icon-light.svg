<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="ComfyUI ROCm Launcher tray icon">
  <title>ComfyUI ROCm Launcher</title>
  <desc>Single-color light tray icon for dark taskbars.</desc>

  <!-- links -->
  <g stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round">
    <line x1="12" y1="9.4" x2="12" y2="6.8"/>
    <line x1="10" y1="11.9" x2="8.1" y2="16.3"/>
    <line x1="14" y1="11.9" x2="15.9" y2="16.3"/>
  </g>

  <!-- center node -->
  <rect x="9" y="9" width="6" height="6" rx="2" fill="#FFFFFF"/>

  <!-- satellite nodes -->
  <circle cx="12" cy="5" r="1.6" fill="#FFFFFF"/>
  <circle cx="7" cy="17" r="1.6" fill="#FFFFFF"/>
  <circle cx="17" cy="17" r="1.6" fill="#FFFFFF"/>
</svg>